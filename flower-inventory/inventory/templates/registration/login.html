{% extends "inventory/base.html" %}
{% load static %}
{% block title %}ログイン｜{{ APP_NAME }}｜{{ COMPANY_NAME }}{% endblock %}
{% block content %}
<div class="login card">
  <div class="login-brand">
    <img src="{% static 'inventory/logo.png' %}" alt="{{ COMPANY_NAME }}">
    <h1>{{ APP_NAME }}</h1>
    <p class="muted">{{ COMPANY_NAME }}</p>
  </div>
  {% if form.errors %}<p class="alert red">ユーザー名かパスワードが違います。</p>{% endif %}
  <form method="post">{% csrf_token %}
    <label for="id_username">ユーザー名</label>
    <input type="text" name="username" id="id_username" autocomplete="username" autocapitalize="off" required autofocus>
    <label for="id_password">パスワード</label>
    <input type="password" name="password" id="id_password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn" type="submit">ログイン</button>
  </form>
</div>
{% endblock %}
